allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# exceljs pulls in @fast-csv/{format,parse}, which pin an ancient
# @types/node@14 — under pnpm's strict linking that creates a second, subtly
# different global `Buffer` type and every exceljs call site fails to
# type-check against it. Force everything onto one version.
overrides:
  "@types/node": ^25.6.0
